name: Build & Deploy

on:
  push:
    branches: [typescript, development]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: npm ci && npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN: ${{ secrets.TOKEN }}
          DISCORD_OWNER_ID: ${{ secrets.DISCORD_OWNER_ID }}
          TEST_DISCORD_WEBHOOK_URL: ${{ secrets.TEST_DISCORD_WEBHOOK_URL }}
          DEBUG_DISCORD_WEBHOOK_URL: ${{ secrets.DEBUG_DISCORD_WEBHOOK_URL }}

      - name: Resolve image metadata
        id: tag
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_name }}" = "typescript" ]; then
            echo "value=latest" >> $GITHUB_OUTPUT
          else
            echo "value=dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.value }}
            ${{ steps.tag.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy (production)
        if: github.ref_name == 'typescript'
        run: curl -fsSL -X GET "${{ secrets.COOLIFY_WEBHOOK_PROD }}"

      - name: Trigger Coolify redeploy (development)
        if: github.ref_name == 'development'
        run: curl -fsSL -X GET "${{ secrets.COOLIFY_WEBHOOK_DEV }}"
